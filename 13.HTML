<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            padding: 10px;
            border: 3px solid #73AD21;
        }

        div.absolute {
            position: absolute;
            left: 50px;
            border: 3px solid blue;
        }

        div.relative {
            position: relative;
            left: 100px;
        }

        div.fixed {
            position: fixed;
            top: 0;
            right: 20px;
            width: 300px;
        }

        div.sticky {
            position: sticky;
            top: 1px;
            left: 20px;
            width: 100px;
        }

        div.first {
            background-color: #ff0000;
            opacity: 0.1;
        }

        div.second {
            background-color: #ff0000;
            opacity: 0.3;
        }

        div.third {
            background-color: #ff0000;
            opacity: 0.6;
        }

        div.default-opacity {
            background-color: #ff0000;
            opacity: 1;
        }
    </style>
</head>

<body>
    <h2>POSITIONING</h2>
    <div>
        Div with no position property
    </div>

    <div class="sticky">
        Div with sticky position property
    </div>

    <div class="relative">
        This div element has position: relative;
        <div class="absolute">
            Absolute class DIV
        </div>
    </div>

    <div class="fixed">
        Div with fixed position property
    </div>

    <h2>OPACITY</h2>
    <p>This is how the opacity property looks:</p>

    <div class="first">
        <p>opacity 0.1</p>
    </div>

    <div class="second">
        <p>opacity 0.3</p>
    </div>

    <div class="third">
        <p>opacity 0.6</p>
    </div>

    <div class="default-opacity">
        <p>opacity 1 (default)</p>
    </div>
