<!DOCTYPE html>

<body>

    <button onclick="myfunction(33.5)">Click Me to know what is "33.5 * 2"</button>

    <script>
        function myfunction(x, y) {
            if (y === undefined) {
                y = 2;
            }

            document.write(x * y);
        }
    </script>

</body>
