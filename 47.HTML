<!DOCTYPE html>
<html>

<head>
   <title>🎉 Math Object Methods</title>

   <style>
      body {
         background: linear-gradient(to right, #00c6ff, #0072ff);
         font-family: 'Segoe UI', sans-serif;
         color: white;
         text-align: center;
         margin-top: 100px;
      }

      .box {
         background-color: rgba(255, 255, 255, 0.1);
         width: 350px;
         margin: auto;
         padding: 20px;
         border-radius: 12px;
      }

      h2 {
         margin-bottom: 15px;
      }

      p {
         font-size: 18px;
         margin: 5px;
      }
   </style>
</head>

<body>

   <div class="box">
      <h2>✨ Math Object Methods</h2>

      <script type="text/javascript">

         var value;

         value = Math.abs(67);
         document.write("<p>Abs Value: " + value + "</p>");

         value = Math.acos(-1);
         document.write("<p>Acos Value: " + value + "</p>");

         value = Math.asin(1);
         document.write("<p>Asin Value: " + value + "</p>");

         value = Math.atan(0.5);
         document.write("<p>Atan Value: " + value + "</p>");

      </script>

   </div>

</body>

</html>
