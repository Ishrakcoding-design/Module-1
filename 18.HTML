<!DOCTYPE html>
<html>

<head>
    <title>CSS Box model example</title>
    <style type="text/CSS">
        .example1 {
            width: 220px;
            background-color:yellow;
            padding: 0px;
            border: 0px;
            margin: 0px;

        }
        .example2 {
            width: 200px;
            background-color:aquamarine;
            padding: 50px;
            border: 2px solid black;
            margin: 50px 20px;

        }
    </style>
</head>

<body>
    <h1>Box Model</h1>
    <hr>
    <p class="example1">This is paragraph 1</p>
    <p class="example2">This is paragraph 2</p>
</body>

</html>
