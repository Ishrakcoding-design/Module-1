<!--Bootstrap typography.-->
<!DOCTYPE html>
<html lang="en">

<head>
    <title>Bootstrap Typography example</title>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">

    </script>

</head>

<body>
    <div class="container">
        <u>
            <h1>Display lists</h1>
        </u>
        <h1 class="display-1">This is Display 1</h1>
        <h1 class="display-2">This is Display 2</h1>
        <h1 class="display-3">This is Display 3</h1>
        <h1 class="display-4">This is Display 4</h1>
    </div>

    <br><br>

    <hr>

    <div class="container">
        <h1>Lighter , Secondary text with small tag and class text-muted:</h1>
        <small class="text-muted">This is a small text.</small>
    </div>

    <hr>

    <br><br>

    <dl>
        <dt> Coffee</dt>
        <dd> White hot drink</dd>
    </dl>
</body>

</html>
