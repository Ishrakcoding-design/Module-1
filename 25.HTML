<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 100%;
        }

        h2 {
            margin-bottom: 10px;
            font-weight: 600;
        }

        p {
            font-size: 18px;
            margin: 10px 0;
        }

        .result {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 26px;
            font-weight: bold;
            color: #ffeb3b;
        }

        hr {
            margin: 20px 0;
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>JavaScript Arrays</h2>
        <p id="array-demo" class="result"></p>

        <h2>JavaScript Array Methods</h2>
        <p>join() and pop()</p>
        <p style="font-size: 14px;">join() converts to string. pop() removes the last element.</p>

        <p id="myjoin"></p>
        <p id="myfirstpop"></p>
        <p id="mysecondpop" class="result"></p>

        <h2>JavaScript Functions</h2>
        <p>Calculation result:</p>
        <p id="func-demo" class="result"></p>
    </div>

    <script>
        // --- 1. Arrays Logic ---
        var cars = ["Coding", "Magic", "Learn"];
        document.getElementById("array-demo").innerHTML = cars[0];

        // --- 2. Array Methods Logic ---
        var fruits = ["Banana", "Orange", "Apple", "Mango"];
        document.getElementById("myjoin").innerHTML = "Joined: " + fruits.join(" * ");
        document.getElementById("myfirstpop").innerHTML = "Original: " + fruits;
        fruits.pop();
        document.getElementById("mysecondpop").innerHTML = "After pop: " + fruits;

        // --- 3. Functions Logic ---
        function add(a, b) {
            return a + b;
        }

        function average(a, b) {
            let sum = add(a, b);
            return sum / 2;
        }

        let result = average(10, 20);
        document.getElementById("func-demo").innerHTML = result;
    </script>

</body>

</html>
