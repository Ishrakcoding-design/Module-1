<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            right: 21px;
            border: 1px solid blue;
        }

        div.absulate {
            position: absolute;
            left: 40px;
            border: 2px solid green;
        }

        div.relative {
            position: relative;
            left: 80px;
            border: 3px solid black;
        }

        div.fixed {
            position: fixed;
            top: 0px;
            right: 50px solid green;
        }

        div.sticky {
            position: sticky;
            top: 1px;
            left: 15px;
            width: 112px;
            border: 2px solid black;
        }
    </style>
</head>

<body>

    <h1>Positioning in CSS</h1>

    <div class="sticky">It will scroll normally at first.</div>
    <div class="relative">The whole relative div shifts right by 100px.</div>
    <div class="fixed">It stays pinned at the top-right of the browser window even while scrolling.</div>
    <div class="absulate">The absolute div is positioned 50px from the left of the nearest positioned parent.<div>

</body>

</html>
