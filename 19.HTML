<!DOCTYPE html>
<html>

<head>
    <style>
        img#lamboright {
            float: right;
        }

        img#lamboleft {
            float: left;
        }
    </style>
</head>

<body>
    <h1>Float right</h1>
    <p>In this example,The image will be float to the right to the paragraph and the text on the paragraph wrap around
        the image.</p>

    <p>
        <img id="lamboright" src="lambo.webp" alt="Car" style="width:100px;height: 100px;">

        <img id="lamboleft" src="lambo.webp" alt="Car" style="width:100px;height: 100px;">
    </p>
</body>

</html>
