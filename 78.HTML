<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="78.CSS" />

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/996973c893.js" crossorigin="anonymous"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700;900&display=swap" rel="stylesheet" />

    <title>Portfolio</title>
</head>

<body>

    <!-- Social Media Section -->
    <div id="social-media" class="container-fluid">
        <div class="container text-white py-5">

            <h4 class="text-warning">Social Media</h4>
            <h1 class="m-heading">Let's be friends</h1>

            <div class="row pt-5">

                <!-- LinkedIn Card -->
                <div class="col-3 media_link btn">
                    <div class="row">
                        <div class="col-8 d-flex align-items-center">
                            <h3 class="m-0 pt-2 text-white">LinkedIn</h3>
                        </div>
                        <div class="col-4 d-flex justify-content-end align-items-center">
                            <i class="fab fa-linkedin fa-2x"></i>
                        </div>
                    </div>
                </div>

                <!-- YouTube Card -->
                <div class="col-3 media_link btn">
                    <div class="row">
                        <div class="col-8 d-flex align-items-center">
                            <h3 class="m-0 pt-2 text-white">YouTube</h3>
                        </div>
                        <div class="col-4 d-flex justify-content-end align-items-center">
                            <i class="fab fa-youtube fa-2x"></i>
                        </div>
                    </div>
                </div>

                <!-- Email Card -->
                <div class="col-3 media_link bg-warning btn">
                    <div class="row">
                        <div class="col-8 d-flex align-items-center">
                            <h3 class="text-dark">Email</h3>
                        </div>
                        <div class="col-4 d-flex justify-content-end align-items-center">
                            <i class="fas fa-envelope fa-2x text-dark"></i>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </div>

</body>

</html>
