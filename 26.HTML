<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>DOM!!!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PREMIUM FONTS -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&family=Orbitron:wght@500&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle at top, #1a1a2e, #0f3460);
            margin: 0;
            padding: 20px;
            color: white;
        }

        h1 {
            font-family: "Orbitron", sans-serif;
            font-size: 42px;
            text-shadow: 0 0 20px cyan;
        }

        h2 {
            font-family: "Playfair Display", serif;
        }

        hr {
            width: 80%;
            border: none;
            height: 2px;
            background: linear-gradient(to right, transparent, cyan, transparent);
            margin: 25px 0;
        }

        /* GLASS CARD */
        .box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            margin-top: 20px;
            width: 350px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            transition: 0.4s;
        }

        .box:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px cyan;
        }

        /* INPUT */
        input {
            padding: 10px;
            border-radius: 10px;
            border: none;
            margin: 5px 0;
            width: 100%;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 10px cyan;
        }

        /* BUTTON */
        button {
            margin-top: 10px;
            padding: 12px;
            width: 100%;
            border-radius: 30px;
            border: none;
            background: linear-gradient(45deg, cyan, blue);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px cyan;
        }

        /* CARD GRID */
        .cards {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            width: 200px;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: 0.4s;
        }

        .card:hover {
            transform: translateY(-10px);
            background: cyan;
            color: black;
        }

        /* GLOW TEXT */
        .glow {
            color: cyan;
            text-shadow: 0 0 10px cyan, 0 0 20px cyan;
        }

        #message {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1 id="one"> Website</h1>
    <p class="glow">Welcome Website to this website.</p>
    <h2>Technology</h2>
    <p>This is the technology section.</p>

    <hr>

    <!-- BUTTON SECTION -->
    <p>Adding JS as separate files</p>

    <button type="button" onclick="myFunction()">
        Click me !!
    </button>

    <p id="demo"></p>

    <hr>

    <!-- COOL CARDS -->
    <div class="cards">
        <div class="card">💻 Coding</div>
        <div class="card">🎨 Design</div>
        <div class="card">🚀 Future</div>
    </div>

    <hr>

    <!-- LOGIN FORM -->
    <h1>REAL TIME VALIDATION USING JS</h1>

    <div class="box">
        <form id="loginForm">

            <label>Email:</label>
            <input type="text" id="email" placeholder="myname@gmail.com">

            <label>Password:</label>
            <input type="password" id="password" placeholder="********">

            <label>Age:</label>
            <input type="number" id="age" placeholder="Enter your age">

            <button type="submit">Login</button>

        </form>

        <p id="message"></p>
    </div>

    <hr>

    <!-- EXTRA FORM (NEW) -->
    <div class="box">
        <h2>Contact Form</h2>
        <input type="text" placeholder="Your Name">
        <input type="email" placeholder="Your Email">
        <input type="text" placeholder="Message">
        <button>Send Message</button>
    </div>

    <br>

    <footer>©Copyright reserved</footer>

    <script>
        var text = document.getElementById("one").innerHTML;
        alert("Hello !!! Welcome to this" + text);

        function myFunction() {
            var a = 33.5;
            var b = 2;
            document.getElementById("demo").innerHTML = a * b;
        }

        function validate(e) {

            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const age = document.getElementById('age').value;
            const msgBox = document.getElementById('message');

            let message = '';

            if (email === '') {
                message = "Please enter an email.";
                msgBox.style.color = "red";
            }

            if (password === '') {
                message = "Please enter an Password.";
                msgBox.style.color = "red";
            }

            if (age === '') {
                message = "Please enter an age.";
                msgBox.style.color = "red";
            }

            else {
                message = "Login successful!";
                msgBox.style.color = "lightgreen";
            }

            msgBox.innerHTML = message;
        }

        document.getElementById("loginForm").onsubmit = validate;

        document.getElementById("loginForm").onsubmit = validate;

        document.getElementById("email").oninput = function () {
            validate({ preventDefault: () => { } });
        };

        document.getElementById("password").oninput = function () {
            validate({ preventDefault: () => { } });
        };

        document.getElementById("age").oninput = function () {
            validate({ preventDefault: () => { } });
        };
    </script>

</body>

</html>
