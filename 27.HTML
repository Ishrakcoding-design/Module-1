<!DOCTYPE html>
<html>

<head>
    <title>JavaScript Advanced UI</title>

    <!-- 🔥 Premium Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #0f2027, #000000);
            margin: 0;
            padding: 20px;
            color: #e0e0e0;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            font-size: 42px;
            color: #00f7ff;
            text-shadow: 0 0 20px #00f7ff;
            letter-spacing: 3px;
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: #00ffcc;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            padding: 25px;
            margin: 25px auto;
            border-radius: 20px;
            max-width: 750px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
            transition: 0.4s;
        }

        .container:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.6);
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #00f7ff, #00ff88);
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.15);
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            color: white;
            box-shadow: 0 0 15px #ff00cc;
        }

        p {
            text-align: center;
            font-size: 17px;
        }

        #number {
            text-align: left;
            padding-left: 25px;
        }

        /* 🔥 Animated glowing background dots */
        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: moveBg 10s linear infinite;
            z-index: -1;
        }

        @keyframes moveBg {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(40px);
            }
        }
    </style>
</head>

<body>

    <h1>⚡ JavaScript Dashboard ⚡</h1>

    <div class="container">
        <h2>Data Types</h2>
        <p id="datatype"></p>
    </div>

    <div class="container">
        <h2>Greeting System</h2>
        <p>Click below 👇</p>
        <button onclick="myFunction()">Run</button>
        <p id="hour"></p>
        <p id="greet"></p>
    </div>

    <div class="container">
        <h2>While Loop Output</h2>
        <p id="number"></p>
    </div>

    <script>
        // Data Types
        var a = 8;
        var b = 10;
        var c = 10;
        var d = null;
        var e;

        document.getElementById("datatype").innerHTML =
            "a and b are equal : " + (a == b) + "<br>" +
            "b and c are equal : " + (b == c) + "<br>" +
            "The value of d is : " + d + "<br>" +
            "The value of e is : " + e;


        // Greeting
        function myFunction() {
            var greeting;
            var time = new Date().getHours();

            if (time < 10) greeting = "🌅 Good morning";
            else if (time < 20) greeting = "☀️ Good day";
            else greeting = "🌙 Good evening";

            document.getElementById("hour").innerHTML = "Current Hour: " + time;
            document.getElementById("greet").innerHTML = greeting;
        }


        // While Loop
        var text = "";
        var i = 0;

        while (i < 10) {
            text += "<br>⚡ The number is " + i;
            i++;
        }

        document.getElementById("number").innerHTML = text;
    </script>

</body>

</html>
