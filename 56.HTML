<!DOCTYPE html>
<html>

<head>
    <title>Data types</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&family=Orbitron:wght@500&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .box {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            font-size: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
        }



        h1 {
            font-weight: bold;
        }

        hr {
            width: 80%;
            border: 1px solid #ccc;
        }

        .box {
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
            width: 350px;
            border-radius: 8px;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        label {
            width: 90px;
            font-weight: bold;
        }

        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #email,
        #password {
            width: 100%;
        }

        #age {
            width: 80px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>JavaScript Data types</h1>

    <div class="box" id="output"></div>

    <script>
        // Variables
        let a = 8;
        let b = 10;
        let c = 10;
        let d = null;
        let e;

        // Output
        let result = "";
        result += "a and b are equal : " + (a == b) + "<br>";
        result += "b and c are equal : " + (b == c) + "<br>";
        result += "The value of d is : " + d + "<br>";
        result += "The value of e is : " + e;

        document.getElementById("output").innerHTML = result;

    </script>

</body>

</html>
