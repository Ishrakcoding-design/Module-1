<!DOCTYPE html>
<html>

<head>
    <title>Lucky Draw</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            overflow-x: hidden;

            font-family: 'Outfit', sans-serif;

            background:
                radial-gradient(circle at top left, rgba(96, 165, 250, 0.22), transparent 28%),
                radial-gradient(circle at bottom right, rgba(125, 211, 252, 0.25), transparent 30%),
                linear-gradient(135deg, #f8fbff 0%, #eef6ff 50%, #fdfdff 100%);
        }

        body::before {
            content: "";
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle,
                    rgba(59, 130, 246, 0.12),
                    transparent 70%);
            top: -200px;
            left: -200px;
            filter: blur(40px);
            z-index: -1;
        }

        body::after {
            content: "";
            position: absolute;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle,
                    rgba(14, 165, 233, 0.12),
                    transparent 70%);
            bottom: -200px;
            right: -200px;
            filter: blur(50px);
            z-index: -1;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 78px;
            font-weight: 700;
            letter-spacing: -3px;
            margin-bottom: 16px;

            background: linear-gradient(90deg,
                    #2563eb,
                    #0ea5e9,
                    #06b6d4);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow:
                0 10px 30px rgba(37, 99, 235, 0.18);

            animation: glow 4s ease-in-out infinite;
        }

        @keyframes glow {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-4px);
            }
        }

        p {
            color: #475569;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
            letter-spacing: 0.2px;
        }

        input {
            width: 340px;

            margin-top: 16px;
            padding: 20px 22px;

            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.9);

            background: rgba(255, 255, 255, 0.65);

            backdrop-filter: blur(18px);

            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 500;
            color: #0f172a;

            outline: none;

            box-shadow:
                0 12px 40px rgba(37, 99, 235, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);

            transition: all 0.4s ease;
        }

        input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        input:focus {
            transform: translateY(-4px) scale(1.02);

            border: 1px solid rgba(96, 165, 250, 0.8);

            background: rgba(255, 255, 255, 0.92);

            box-shadow:
                0 22px 55px rgba(37, 99, 235, 0.18),
                0 0 0 8px rgba(96, 165, 250, 0.10);
        }

        button {
            margin-top: 28px;
            padding: 18px 42px;

            border: none;
            border-radius: 22px;

            background: linear-gradient(135deg,
                    #2563eb,
                    #0ea5e9,
                    #06b6d4);

            color: white;

            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;

            cursor: pointer;

            box-shadow:
                0 18px 45px rgba(37, 99, 235, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);

            transition: all 0.35s ease;
        }

        button:hover {
            transform: translateY(-6px) scale(1.04);

            box-shadow:
                0 28px 65px rgba(37, 99, 235, 0.38);
        }

        button:active {
            transform: scale(0.96);
        }

        #msg-name,
        #msg-guess {
            margin-top: 8px;
            margin-bottom: 4px;

            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        #result {
            margin-top: 34px;

            min-width: 380px;

            padding: 24px 28px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.68);

            backdrop-filter: blur(20px);

            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.5;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.08);

            transition: all 0.4s ease;
        }

        #timer {
            margin-top: 28px;

            padding: 14px 28px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.75);

            backdrop-filter: blur(15px);

            color: #2563eb;

            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.4px;

            box-shadow:
                0 10px 30px rgba(37, 99, 235, 0.12);
        }

        @media (max-width: 500px) {

            h1 {
                font-size: 56px;
                text-align: center;
            }

            input {
                width: 92%;
            }

            #result {
                width: 92%;
                min-width: auto;
                text-align: center;
            }

            p {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <h1>Lucky Draw</h1>

    <p>Enter your name and guess a lucky number from 1 to 5.</p>

    <input type="text" id="name" placeholder="Enter your name">
    <p id="msg-name"></p>

    <input type="number" id="guess" min="1" max="5" placeholder="Guess number (1-5)">
    <p id="msg-guess"></p>

    <button onclick="checkForm()">Try Your Luck</button>

    <p id="result"></p>

    <p id="timer">Time on page: 0 seconds</p>

    <script>

        let seconds = 0;

        setInterval(function () {
            seconds++;
            document.getElementById("timer").innerHTML =
                "Time on page: " + seconds + " seconds";
        }, 1000);

        function checkForm() {

            let name = document.getElementById("name").value;
            let guess = document.getElementById("guess").value;

            let ok = true;

            // Name Validation
            if (name === "") {
                document.getElementById("msg-name").innerHTML =
                    "Please enter your name.";
                document.getElementById("msg-name").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-name").innerHTML =
                    "Name looks good!";
                document.getElementById("msg-name").style.color = "green";
            }

            // Guess Validation
            if (guess === "") {
                document.getElementById("msg-guess").innerHTML =
                    "Please enter your lucky number.";
                document.getElementById("msg-guess").style.color = "red";
                ok = false;
            } else {
                document.getElementById("msg-guess").innerHTML =
                    "Lucky number entered!";
                document.getElementById("msg-guess").style.color = "green";
            }

            // Lucky Draw Result
            if (ok) {

                let luckyNumber = Math.floor(Math.random() * 5) + 1;

                if (parseInt(guess) === luckyNumber) {
                    document.getElementById("result").innerHTML =
                        "🎉 Congratulations " + name +
                        "! You won! Lucky Number was " + luckyNumber;
                    document.getElementById("result").style.color = "green";
                } else {
                    document.getElementById("result").innerHTML =
                        "😢 Sorry " + name +
                        "! Try again. Lucky Number was " + luckyNumber;
                    document.getElementById("result").style.color = "red";
                }
            }
        }

    </script>

</body>

</html>
