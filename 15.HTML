<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            width: 500px;
            height: 300px;
            background-color: yellow;
            border: 1px solid black;
        }

        #mydiv {
            transform: rotateX(180deg);
        }
    </style>
</head>

<body>
    <h1>welcome to codingal</h1>
    <p>Ready to learn the rotate method...</p>

    <div>
        Codingal
    </div>
    <div id="mydiv">
        Codingal
    </div>
</body>

</html>
