<!DOCTYPE html>
<html>

<head>
    <title>Data types</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@600&family=Orbitron:wght@500&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        .box {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
            font-size: 20px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
        }



        h1 {
            font-weight: bold;
        }

        hr {
            width: 80%;
            border: 1px solid #ccc;
        }

        .box {
            background: white;
            border: 1px solid #ddd;
            padding: 20px;
            margin-top: 20px;
            width: 350px;
            border-radius: 8px;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        label {
            width: 90px;
            font-weight: bold;
        }

        input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #email,
        #password {
            width: 100%;
        }

        #age {
            width: 80px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <p>Click the button to get a time-based greeting:</p>

    <button onclick="myFunction()">Click on it to know the time.</button>

    <p id="hour"></p>
    <p id="greet"></p>

    <script>
        function myFunction() {
            var greeting;
            var time = new Date().getHours();

            if (time < 10) {
                greeting = "Good morning";
            }

            else if (time < 20) {
                greeting = "Good day";

            } else {
                greeting = "Good evening";
            }

            document.getElementById("hour").innerHTML = "Current time is " + time;
            document.getElementById("greet").innerHTML = greeting;

        }
    </script>

</body>

</html>
