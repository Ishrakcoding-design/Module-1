<!DOCTYPE html>
<html>

<head>
    <title>Function Declaration</title>
</head>

<body>
    <center>
        <u style="color: green;">
            <h1 style="color:green">JavaScript Education</h1>
        </u>
        <h3>34.5 * 2 = ?</h3>

        <script>
            var result = function (a, b) {
                return a * b;
            };

            document.write(result(34.5, 2));
        </script>
    </center>
</body>

</html>
