<!DOCTYPE html>
<html lang="en">

<head>
   <title>JavaScript Statements</title>
</head>

<body>
   <p> A <b>JavaScript program</b> is a list of
      <b>statements</b> to be executed by a computer .
   </p>
   <p id="demo"></p>
   <script>
      var x, y, z; //statement 1
      x = 69;
      y = 68;
      z = x + y;
      document.getElementById("demo").innerHTML = "The total value is: z" + z;
   </script>
</body>

</html>
