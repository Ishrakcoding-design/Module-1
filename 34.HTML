<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

    <title>Bootstrap Carousel</title>
</head>

<body>
    <div class="container">
        <u>
            <h2 style="color: red;font-family: 'Courier New', Courier, monospace;">CR7 Example</h2>
        </u>
        <div id="myCarousel" class="carousel slide" data-ride="carousel">
            <ol class="carousel-indicators">
                <li data-target="#myCarousel" ,data-slide-to="0" ,class="active"></li>
                <li data-target="#myCarousel" ,data-slide-to="1"></li>
                <li data-target="#myCarousel" ,data-slide-to="2"></li>
            </ol>

            <div class="carousel-inner">
                <div class="item active">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQR1jnXmdRDbvX6pPwIug0fypOjWeIqg64JBQ&s"
                        alt="Image 1">
                </div>



                <div class="item">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6d2MB3W25Rs5sqGQMrkUiFEwvCyw--MO32w&s"
                        alt="Image 2">
                </div>



                <div class="item">
                    <img src="https://i.pinimg.com/474x/1b/d1/22/1bd122a626d75b259dec442a5df17d79.jpg" alt="Image 3">
                </div>
            </div>
            <!--left and right control.-->
            <a class="left carousel-control" href="" data-slide="prev"><span
                    class="glyphicon glyphicon-chevron-left"></span>
                <span class="sr-only">Previous</span></a>
            <a class="right carousel-control" href="#myCarousel" data-slide="next"></a>
            <a class="right carousel-control" href="#myCarousel" data-slide="next"><span
                    class="glyphicon glyphicon-chevron-right"></span>
                <span class="sr-only">Previous</span>Next</a>
        </div>
    </div>
</body>

</html>
