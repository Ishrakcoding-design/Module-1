<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* ===== COLOR SYSTEM ===== */
        :root {
            --bg: #f4f7fb;
            --card: rgba(255, 255, 255, 0.75);
            --text: #1f2937;
            --primary: #1f6f50;
            --accent: #3bb273;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        /* DARK MODE */
        body.dark {
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #e5e7eb;
            --primary: #4ade80;
            --accent: #22c55e;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: 0.4s ease;
        }

        /* HEADER */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--card);
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: var(--primary);
            color: white;
            font-weight: bold;
        }

        /* CARD DESIGN */
        .card {
            width: 85%;
            margin: 25px auto;
            padding: 25px;
            border-radius: 18px;
            background: var(--card);
            backdrop-filter: blur(12px);
            box-shadow: var(--shadow);
            animation: fadeIn 0.8s ease;
        }

        h1 {
            color: var(--primary);
        }

        .output {
            font-size: 18px;
            margin-top: 10px;
        }

        /* ANIMATION */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 600px) {
            .card {
                width: 92%;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->
    <div class="topbar">
        <h3>⚡ JS Learning Dashboard</h3>
        <button onclick="toggleDark()">🌙 Toggle</button>
    </div>

    <!-- STRING METHODS -->
    <div class="card">
        <h1>JavaScript String Methods</h1>

        <div class="output">
            <script>
                let str = "AmAzInG";

                document.write("Upper: " + str.toUpperCase() + "<br>");
                document.write("Lower: " + str.toLowerCase() + "<br>");
                document.write("Starts with i? " + str.startsWith("i") + "<br>");

                let str1 = "I learnt about Methods";
                let pattern = new RegExp("about");
                document.write("Regex test: " + pattern.test(str1));
            </script>
        </div>
    </div>

    <!-- LOOP -->
    <div class="card">
        <h1>JavaScript For Loop</h1>

        <div class="output" id="demo1"></div>

        <script>
            let fruits = ["Apple", "Banana", "Mango", "Orange", "Grapes"];
            let text = "";

            for (let i = 0; i < fruits.length; i++) {
                text += "🍎 " + fruits[i] + "<br>";
            }

            document.getElementById("demo1").innerHTML = text;
        </script>
    </div>

    <!-- DAY -->
    <div class="card">
        <h1>Today’s Day</h1>

        <div class="output" id="demo2"></div>

        <script>
            let day;

            switch (new Date().getDay()) {
                case 0: day = "Sunday"; break;
                case 1: day = "Monday"; break;
                case 2: day = "Tuesday"; break;
                case 3: day = "Wednesday"; break;
                case 4: day = "Thursday"; break;
                case 5: day = "Friday"; break;
                case 6: day = "Saturday"; break;
            }

            document.getElementById("demo2").innerHTML =
                "✨ Today is a special day which is " + day;
        </script>
    </div>

    <!-- DARK MODE SCRIPT -->
    <script>
        function toggleDark() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>

</html>
