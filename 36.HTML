<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>JavaScript Variables</title>
   <style>
      .body {
         background-color: rgb(211, 234, 248);
      }
   </style>
</head>

<body class="body">
   <h1 style="color: rgb(0, 102, 255); text-align: center;">JavaScript Variables</h1>
   <p>Sum of two Numbers.</p>
   <p id="result"></p>
   <script>
      var num1 = 5;
      var num2 = 6;
      var num3 = 4;
      var sum = num1 + num2 + num3;
      document.getElementById("result").innerHTML = "The total sum is: " + sum;
   </script>
</body>

</html>
