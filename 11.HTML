<!DOCTYPE html>
<html lang="English">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width" ,initial-scale="1.0">
    <title>CSS EXAMPLE</title>
    <!--internal CSS-->
    <style>
        h2 {
            color: green;
        }
    </style>
    <!--External CSS-->

    <link rel="stylesheet" href="style.css" </head>

<body>

    <hr>

    <!--Inline CSS-->
    <h1 style="color:green">Inline CSS Example</h1>
    <!--Internal CSS -->
    <h1 style="color:red">Internal CSS Example</h1>
    <!--External CSS-->
    <h1 style="color:blue">External CSS Example</h1>

    <hr>

    <!--Element selector example-->
    <h4 style="color:brown">Element sector example</h4>

    <hr>

    <!--Class and ID selector example-->
    <h2 id="myid" style="color:blueviolet">Class sector example</h2>
    <h2 id="myid" style="color:darkblue">ID sector example</h2>

    <hr>

    <!--Group selector example-->
    <h4 style="color:darkred">Group selector example</h4>
    <p style="color:darkblue">Group selector example</p>

    <hr>

</body>

</html>
